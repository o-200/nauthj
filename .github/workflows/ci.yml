name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # - name: Run linter
      #   run: npm run lint:check

      - name: Run unit tests
        run: npm test

      # - name: Run e2e tests
      #   run: npm run test:e2e

      - name: Build project
        run: npm run build